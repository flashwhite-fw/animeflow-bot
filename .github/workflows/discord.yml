name: AnimeFlow Discord
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: animeflow-discord
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test d'envoi (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" \
            -d '{"content":"✅ Test AnimeFlow : le bot est bien connecté !"}' "$DISCORD_WEBHOOK_URL")
          echo "Réponse Discord : $code (204 = OK)"
      - name: Restaurer la mémoire des messages déjà envoyés
        uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: node post.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
